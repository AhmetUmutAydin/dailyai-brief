name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site/data
          cp web/index.html site/index.html
          cp data/*.json site/data/ 2>/dev/null || true
          test -f site/data/index.json || echo '{"dates":[]}' > site/data/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
