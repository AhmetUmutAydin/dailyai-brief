<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dailyai-brief</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --ink: #1b222c; --ink-2: #4d5866; --muted: #8a94a0; --line: #e3e7ec;
    --accent: #2f6fed; --up: #1f9c6c; --down: #d1483f; --flat: #a3adb8; --high: #b7791f; --high-bg: #fff7e6;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --p0: #2f6fed; --p1: #c2410c; --p2: #0f766e; --p3: #7c3aed; --p4: #be185d; --p5: #4d7c0f; --p6: #b45309; --p7: #0369a1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --panel: #191c21; --panel-2: #20242a; --ink: #e7eaee; --ink-2: #aeb6c0; --muted: #737d89; --line: #2a2f36; --accent: #7aa2ff; --up: #3dbf8a; --down: #e8615a; --flat: #5f6975; --high: #f2c14e; --high-bg: #2a2416;
      --p0: #7aa2ff; --p1: #fb923c; --p2: #2dd4bf; --p3: #a78bfa; --p4: #f472b6; --p5: #a3e635; --p6: #fbbf24; --p7: #38bdf8; }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .date { font: 14px var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }

  .tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 -16px 22px; padding: 0 16px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 9px 10px; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .tabs .n { font: 500 11px/1 var(--mono); color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 3px 6px; }
  .tabs .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
  .tabs .gap { flex: none; width: 10px; }
  .tabs button { user-select: none; -webkit-user-select: none; }
  @media (min-width: 640px) { .tabs { flex-wrap: wrap; overflow: visible; row-gap: 0; } }

  h2 { margin: 26px 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 10px; }
  h2:first-child { margin-top: 0; }
  h2 .rule { flex: 1; height: 1px; background: var(--line); }
  h2 .chip { font-size: 13px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 8px 0; }
  .meta { font: 13px var(--mono); color: var(--muted); }
  .empty { color: var(--muted); font-size: 15px; margin: 4px 0; }
  q { quotes: "“" "”"; color: var(--ink-2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
  .src { font: 13px var(--mono); }

  .attn { display: flex; flex-direction: column; gap: 8px; }
  .attn .card { display: grid; grid-template-columns: 22px 1fr; gap: 12px; border-left: 3px solid var(--pc); }
  .attn .rank { font: 600 14px var(--mono); color: var(--muted); padding-top: 3px; }
  .attn b { display: block; font-weight: 600; font-size: 16px; }
  .attn .why { color: var(--ink-2); font-size: 15px; margin: 3px 0 6px; }

  .topic .name { font-weight: 600; margin-bottom: 8px; font-size: 16px; }
  .view { padding: 10px 0; border-top: 1px solid var(--line); }
  .view:first-of-type { border-top: 0; padding-top: 0; }
  .view .stance { font-weight: 500; margin: 2px 0; }
  .view q { display: block; font-size: 15px; margin: 2px 0 4px; }

  .filters { display: inline-flex; gap: 4px; }
  .filters button { font: inherit; font-size: 12px; background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  .filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .asset { padding: 12px 16px; }
  .asset.high { background: var(--high-bg); border-color: transparent; }
  .asset summary { list-style: none; display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 10px; cursor: pointer; }
  .asset summary::-webkit-details-marker { display: none; }
  .sym { font: 600 15px var(--mono); }
  .nm { color: var(--ink-2); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--flat); }
  .dot.up { background: var(--up); } .dot.down { background: var(--down); }
  .asset .why { color: var(--ink-2); font-size: 14px; margin: 6px 0 0 94px; }
  .asset ul { list-style: none; margin: 10px 0 0 94px; padding: 0; }
  .asset li { margin: 8px 0; font-size: 15px; }
  .asset li q { display: block; }
  .tag { font: 500 12px var(--mono); margin-left: 6px; }
  .tag.up { color: var(--up); } .tag.down { color: var(--down); } .tag.flat { color: var(--flat); }
  .low { display: flex; flex-wrap: wrap; gap: 6px; }
  .low details { display: contents; }
  .low summary { list-style: none; cursor: pointer; font: 500 13px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; }
  .low summary::-webkit-details-marker { display: none; }
  .low details[open] summary { border-color: var(--ink); }
  .low .body { flex-basis: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .low .body li { margin: 4px 0; }
  .hidden { display: none !important; }

  .digest { border-left: 3px solid var(--pc); }
  .digest p { margin: 0; font-size: 16px; line-height: 1.65; }
  .digest p + p { margin-top: 10px; }
  .digest b { font-weight: 600; color: var(--ink); }
  .item .title { font-weight: 600; font-size: 16px; }
  .item p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
  .ia { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .ia li { display: grid; grid-template-columns: 84px auto 1fr; gap: 8px; align-items: baseline; font-size: 14px; }
  .ia .note { color: var(--ink-2); }
  .sources summary { list-style: none; cursor: pointer; font-size: 14px; color: var(--muted); }
  .sources summary::-webkit-details-marker { display: none; }
  .sources ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .sources li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .sources li .meta { display: block; margin-bottom: 2px; }
  @media (max-width: 480px) {
    .asset summary { grid-template-columns: 72px 1fr auto; }
    .asset ul, .asset .why { margin-left: 0; }
    .ia li { grid-template-columns: 72px auto; } .ia .note { grid-column: 1 / -1; }
  }
  footer { margin-top: 40px; font: 12px/1.6 var(--mono); color: var(--muted); }
  .errs { margin-top: 8px; color: var(--down); }
  @media (prefers-reduced-motion: no-preference) { details[open] > *:not(summary) { animation: in .15s ease-out; } @keyframes in { from { opacity: 0; } } }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>dailyai-brief</h1>
    <select id="date" class="date" aria-label="Report date"></select>
  </header>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="root" role="tabpanel"><p class="empty">Loading…</p></div>
  <footer id="foot"></footer>
</main>
<script>
const base = location.pathname.includes("/web/") ? "../data/" : "data/";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const link = (url, text, cls = "src") => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
const cls = (s) => (s === "positive" ? "up" : s === "negative" ? "down" : "flat");
const label = { positive: "positive", negative: "negative", neutral: "neutral" };
const fmt = (iso) => iso.slice(0, 16).replace("T", " ");
const tr = { ı: "i", İ: "i", ş: "s", Ş: "s", ğ: "g", Ğ: "g", ç: "c", Ç: "c", ö: "o", Ö: "o", ü: "u", Ü: "u" };
const slug = (s) => s.replace(/[ıİşŞğĞçÇöÖüÜ]/g, (c) => tr[c]).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const PRI = { high: 0, medium: 1, low: 2 };
let report = null;
let tab = "overview";
let filter = "all";
let colors = {};

const pc = (person) => `style="--pc: var(--p${colors[person] ?? 0})"`;
const chip = (person) => `<span class="chip" ${pc(person)}>${esc(person)}</span>`;

function state() {
  const [d, t] = location.hash.slice(1).split("/");
  return { date: d || "", tab: t || "overview" };
}
function setHash(date, t) { history.replaceState(null, "", `#${date}/${t}`); }

async function loadIndex() {
  const { dates } = await (await fetch(base + "index.json", { cache: "no-store" })).json();
  const sel = document.getElementById("date");
  sel.innerHTML = dates.map((d) => `<option value="${d}">${d}</option>`).join("");
  sel.onchange = () => loadReport(sel.value);
  if (dates.length === 0) {
    document.getElementById("root").innerHTML = `<p class="empty">No reports yet. The first one appears after the routine runs.</p>`;
    return;
  }
  const s = state();
  sel.value = dates[0];
  tab = s.tab;
  loadReport(sel.value);
}

async function loadReport(date) {
  report = await (await fetch(`${base}${date}.json`, { cache: "no-store" })).json();
  colors = Object.fromEntries(report.persons.map((p, i) => [p.name, i % 8]));
  renderTabs();
  render();
  const total = report.persons.reduce((n, p) => n + p.items.length, 0);
  const errs = report.errors ?? [];
  document.getElementById("foot").innerHTML = `${total} items · ${report.assets.length} assets · generated ${esc(fmt(report.generated_at))} UTC${errs.length ? `<div class="errs">${errs.map((e) => `<div>⚠ ${esc(e)}</div>`).join("")}</div>` : ""}`;
}

function personHas(p) { return (p.digest?.length ?? 0) > 0 || p.items.length > 0; }

function tabList() {
  const t = [];
  if (report.attention.length) t.push({ id: "overview", name: "Overview", n: report.attention.length });
  if (report.macro.length) t.push({ id: "macro", name: "Macro", n: report.macro.length });
  if (report.assets.length) t.push({ id: "assets", name: "Assets", n: report.assets.length });
  const solo = report.persons.filter((p) => !p.group && personHas(p));
  solo.forEach((p, i) => t.push({ id: slug(p.name), name: p.name, n: p.items.length, person: p.name, first: i === 0 }));
  const groups = [...new Set(report.persons.filter((p) => p.group && personHas(p)).map((p) => p.group))];
  groups.forEach((g) => t.push({ id: "g-" + slug(g), name: g, n: report.persons.filter((p) => p.group === g && personHas(p)).length, group: g }));
  return t;
}

function renderTabs() {
  const tabs = tabList();
  if (tabs.length === 0) { document.getElementById("tabs").innerHTML = ""; return; }
  if (!tabs.some((t) => t.id === tab)) tab = tabs[0].id;
  document.getElementById("tabs").innerHTML = tabs.map((t) => `${t.first ? `<span class="gap"></span>` : ""}<button role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}" ${t.person ? pc(t.person) : ""}>${t.person ? `<span class="sw"></span>` : ""}${esc(t.name)}<span class="n">${t.n}</span></button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; renderTabs(); render(); }));
  document.querySelector("#tabs button[aria-selected='true']")?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
document.getElementById("tabs").addEventListener("wheel", (e) => {
  const el = e.currentTarget;
  if (el.scrollWidth <= el.clientWidth || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  el.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

function render() {
  setHash(report.date, tab);
  const root = document.getElementById("root");
  if (tabList().length === 0) { root.innerHTML = `<p class="empty">Quiet day. Nothing in scope from the people you follow.</p>`; return; }
  root.innerHTML = tab === "overview" ? overview() : tab === "macro" ? macro() : tab === "assets" ? assets() : tab.startsWith("g-") ? group(tab.slice(2)) : person(report.persons.find((p) => slug(p.name) === tab));
  document.querySelectorAll(".filters button").forEach((b) => (b.onclick = () => { filter = b.dataset.f; applyFilter(); }));
  applyFilter();
  window.scrollTo(0, 0);
}

function overview() {
  return `<div class="attn">${report.attention.map((x, i) => `<div class="card" ${pc(x.person)}><span class="rank">${i + 1}</span><div><b>${esc(x.title)}</b><div class="why">${esc(x.why)}</div>${chip(x.person)} · ${link(x.source_url, "source")}</div></div>`).join("")}</div>`;
}

function macro() {
  return report.macro.map((t) => `<div class="card topic"><div class="name">${esc(t.topic)}</div>${t.views.map((v) => `<div class="view">${chip(v.person)}<div class="stance">${esc(v.view)}</div><q>${esc(v.quote)}</q>${link(v.source_url, "source")}</div>`).join("")}</div>`).join("");
}

function mentionList(ms) {
  return `<ul>${ms.map((m) => `<li>${chip(m.person)}<span class="tag ${cls(m.sentiment)}">${label[m.sentiment]}</span><q>${esc(m.quote)}</q>${link(m.source_url, "source")}</li>`).join("")}</ul>`;
}
function dots(a) { return `<span class="dots">${a.mentions.map((m) => `<span class="dot ${cls(m.sentiment)}" title="${esc(m.person)}: ${label[m.sentiment]}"></span>`).join("")}</span>`; }
function flags(a) { const has = (s) => a.mentions.some((m) => m.sentiment === s); return `data-up="${has("positive")}" data-down="${has("negative")}"`; }

function assets() {
  const sorted = [...report.assets].sort((x, y) => (PRI[x.priority ?? "medium"] - PRI[y.priority ?? "medium"]) || (y.mentions.length - x.mentions.length));
  const high = sorted.filter((a) => (a.priority ?? "medium") === "high");
  const mid = sorted.filter((a) => (a.priority ?? "medium") === "medium");
  const low = sorted.filter((a) => a.priority === "low");
  const card = (a, open) => `<details class="card asset ${a.priority ?? "medium"}" ${flags(a)} ${open ? "open" : ""}><summary><span class="sym">${esc(a.symbol)}</span><span class="nm">${esc(a.name)}</span>${dots(a)}</summary>${a.why ? `<div class="why">${esc(a.why)}</div>` : ""}${mentionList(a.mentions)}</details>`;
  const pill = (a) => `<details class="row" ${flags(a)}><summary>${esc(a.symbol)}${dots(a)}</summary><div class="body"><b>${esc(a.name)}</b>${mentionList(a.mentions)}</div></details>`;
  return `
    <h2>Priority<span class="rule"></span><span class="filters"><button data-f="all">All</button><button data-f="up">Positive</button><button data-f="down">Negative</button></span></h2>
    ${high.length ? high.map((a) => card(a, true)).join("") : ""}
    ${mid.length ? mid.map((a) => card(a, false)).join("") : ""}
    ${!high.length && !mid.length ? `<p class="empty">No asset with a real view today.</p>` : ""}
    ${low.length ? `<h2>Also mentioned<span class="rule"></span></h2><div class="low">${low.map(pill).join("")}</div>` : ""}
  `;
}

function applyFilter() {
  document.querySelectorAll(".asset, .low .row").forEach((r) => {
    const show = filter === "all" || (filter === "up" && r.dataset.up === "true") || (filter === "down" && r.dataset.down === "true");
    r.classList.toggle("hidden", !show);
  });
  document.querySelectorAll(".filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
}

function group(id) {
  const members = report.persons.filter((p) => p.group && slug(p.group) === id && personHas(p));
  return members.map((p) => `<h2 ${pc(p.name)}><span class="chip">${esc(p.name)}</span><span class="rule"></span></h2>${person(p, true)}`).join("");
}

function person(p, compact = false) {
  if (!p) return `<p class="empty">Unknown tab.</p>`;
  const videos = p.items.filter((i) => i.platform === "youtube");
  const posts = p.items.filter((i) => i.platform !== "youtube");
  const paras = typeof p.digest === "string" ? p.digest.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean) : p.digest?.length ? [p.digest.join(" ")] : [];
  const digest = paras.length
    ? `<div class="card digest" ${pc(p.name)}>${paras.map((d) => `<p>${esc(d).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")}</p>`).join("")}</div>`
    : posts.length ? `<div class="card"><ol class="digest">${posts.map((i) => `<li>${esc(i.summary)} ${link(i.url, "source")}</li>`).join("")}</ol></div>` : "";
  const vids = videos.map((i) => `
    <div class="card item">
      <div class="meta">youtube · ${esc(fmt(i.published_at))}</div>
      <div class="title">${link(i.url, i.title, "")}</div>
      <p>${esc(i.summary)}</p>
      ${i.assets?.length ? `<ul class="ia">${i.assets.map((a) => `<li><span class="sym">${esc(a.symbol)}</span><span class="tag ${cls(a.sentiment)}">${label[a.sentiment]}</span><span class="note">${esc(a.note)}</span></li>`).join("")}</ul>` : ""}
    </div>`).join("");
  const sources = posts.length && p.digest?.length
    ? `<details class="sources"><summary>Sources · ${posts.length} posts</summary><ul>${posts.map((i) => `<li><span class="meta">${esc(fmt(i.published_at))}</span>${link(i.url, i.title, "")}</li>`).join("")}</ul></details>`
    : "";
  if (!digest && !vids) return `<p class="empty">Nothing in scope yesterday.</p>`;
  if (compact) return `${digest}${vids}${sources}`;
  return `${digest ? `<h2>Day in short<span class="rule"></span></h2>${digest}` : ""}${vids ? `<h2>Videos<span class="rule"></span></h2>${vids}` : ""}${sources ? `<h2>Sources<span class="rule"></span></h2>${sources}` : ""}`;
}

loadIndex().catch((e) => { document.getElementById("root").innerHTML = `<p class="empty">Could not load: ${esc(e.message)}. Reload the page.</p>`; });
</script>
</body>
</html>
